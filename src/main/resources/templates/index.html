<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>SportRadar</title>
    <link rel="stylesheet" th:href="@{/css/Style.css}">
</head>
<body>

<!-- ── Navbar ──────────────────────────────────────────────────────────── -->
<nav class="navbar green">
    <a class="navbar-brand" href="/">SportRadar</a>
    <div class="navbar-right">
        <th:block th:if="${currentUser != null}">
            <a th:href="@{/profile}" style="text-decoration:none">
                <div class="avatar-circle" title="Profile">
                    <span th:text="${#strings.substring(currentUser.name,0,1)}">U</span>
                </div>
            </a>
            <form th:action="@{/logout}" method="post" style="margin:0">
                <button class="btn-nav">Log out</button>
            </form>
        </th:block>
        <th:block th:if="${currentUser == null}">
            <button class="btn-nav" onclick="location.href='/login'">Log in</button>
            <button class="btn-nav outlined" onclick="location.href='/register'">Register</button>
        </th:block>
    </div>
</nav>

<div class="page">

    <!-- ── Hero ──────────────────────────────────────────────────────────── -->
    <div class="hero">
        <div class="hero-text">
            <h1 class="hero-title">SportRadar</h1>
            <p class="hero-subtitle">Join or create local games!</p>

            <div style="margin-bottom:20px">
                <label style="font-size:.85rem;color:var(--muted);display:block;margin-bottom:4px">Choose city</label>
                <input id="cityInput" type="text" placeholder="Enter city" value="Warsaw"
                       style="width:220px;padding:9px 14px;border-radius:999px;border:1.5px solid var(--border);font-size:.9rem;"/>
            </div>

            <div class="hero-actions">
                <button class="btn-action dark"  onclick="location.href='/events'">Events</button>
                <button class="btn-action dark"  onclick="location.href='/events/new'">Post an Event</button>
                <button class="btn-action green" onclick="location.href='/games'">Games</button>
                <button class="btn-action dark"  onclick="location.href='/games/new'">Post game</button>
            </div>
        </div>

    </div>

    <!-- ── Upcoming games ────────────────────────────────────────────────── -->
    <div th:if="${games != null and !#lists.isEmpty(games)}">
        <h2 class="section-title">Upcoming Games</h2>
        <div class="card-grid">
            <a class="game-card"
               th:each="g, stat : ${games}"
               th:classappend="${stat.index % 3 == 1} ? 'dark' : 'light'"
               th:href="@{/games/{id}(id=${g.id})}">
                <div class="sport-label" th:text="${g.sport.name}">Sport</div>
                <div>
                    <div class="card-meta">
                        <div class="mini-avatar">🏃</div>
                        <span th:text="${#sets.size(g.players) + '/' + g.capacity}">0/10</span>
                    </div>
                    <div class="card-location" th:text="${g.location.name}">Location</div>
                </div>
            </a>
        </div>
    </div>

</div>
</body>
</html>
