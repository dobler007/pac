<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Locations – SportRadar</title>
    <link rel="stylesheet" th:href="@{/css/Style.css}">
</head>
<body>

<nav class="navbar green">
    <a class="navbar-brand" href="/">SportRadar</a>
    <div class="navbar-right">
        <th:block th:if="${currentUser != null}">
            <a th:href="@{/profile}" style="text-decoration:none">
                <div class="avatar-circle"><span th:text="${#strings.substring(currentUser.name,0,1)}">U</span></div>
            </a>
            <form th:action="@{/logout}" method="post" style="margin:0">
                <button class="btn-nav">Log out</button>
            </form>
        </th:block>
        <th:block th:if="${currentUser == null}">
            <button class="btn-nav" onclick="location.href='/login'">Log in</button>
        </th:block>
    </div>
</nav>

<div class="inner-page">
    <h1 style="font-size:1.8rem;font-weight:800;margin-bottom:24px">Locations</h1>

    <div class="card-grid">
        <a class="event-card"
           th:each="l : ${locations}"
           th:href="@{/locations/{id}(id=${l.id})}"
           style="border-left-color:var(--maroon)">
            <div class="event-name" th:text="${l.name}">Location</div>
            <div class="event-meta">
                <span th:text="${l.address}">Address</span>
            </div>
        </a>
    </div>

    <div class="empty" th:if="${#lists.isEmpty(locations)}">No locations yet.</div>

    <a href="/" class="back-link" style="margin-top:32px">&#8592; Home</a>
</div>

</body>
</html>
