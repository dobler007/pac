<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Log In – SportRadar</title>
    <link rel="stylesheet" th:href="@{/css/Style.css}">
</head>
<body class="auth-wrap">

<nav class="navbar green">
    <a class="navbar-brand" href="/">SportRadar</a>
</nav>

<div class="auth-body">
    <div class="auth-card">
        <div class="auth-logo">Welcome back 👋</div>
        <p class="auth-subtitle">Log in to join or create games</p>

        <!-- Global error (wrong credentials) -->
        <div th:if="${#fields.hasGlobalErrors()}" class="error-banner">
            <span th:each="err : ${#fields.globalErrors()}" th:text="${err}">Error</span>
        </div>

        <form th:action="@{/login}" th:object="${loginForm}" method="post" novalidate>

            <div class="field">
                <label>Username</label>
                <input th:field="*{login}"
                       th:classappend="${#fields.hasErrors('login')} ? 'input-error'"
                       placeholder="your_username"/>
                <span class="field-error" th:if="${#fields.hasErrors('login')}"
                      th:errors="*{login}">Error</span>
            </div>

            <div class="field">
                <label>Password</label>
                <input th:field="*{password}" type="password"
                       th:classappend="${#fields.hasErrors('password')} ? 'input-error'"
                       placeholder="••••••••"/>
                <span class="field-error" th:if="${#fields.hasErrors('password')}"
                      th:errors="*{password}">Error</span>
            </div>

            <button class="btn-submit green" type="submit">Log In</button>
        </form>

        <p class="auth-footer">
            No account? <a href="/register">Register here</a>
        </p>
    </div>
</div>

</body>
</html>
