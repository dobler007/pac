<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Register – SportRadar</title>
    <link rel="stylesheet" th:href="@{/css/Style.css}">
</head>
<body class="auth-wrap">

<nav class="navbar green">
    <a class="navbar-brand" href="/">SportRadar</a>
</nav>

<div class="auth-body">
    <div class="auth-card" style="max-width:520px">
        <div class="auth-logo">Create account 🏃</div>
        <p class="auth-subtitle">Join SportRadar and start playing</p>

        <form action="/register" method="post">
            <div class="form-row">
                <div class="field">
                    <label>Username</label>
                    <input name="login" required minlength="2" maxlength="20" placeholder="cool_player"/>
                </div>
                <div class="field">
                    <label>Password</label>
                    <input name="password" type="password" required minlength="2" placeholder="••••••••"/>
                </div>
            </div>

            <div class="field">
                <label>Full name</label>
                <input name="name" required placeholder="Jan Kowalski"/>
            </div>

            <div class="form-row">
                <div class="field">
                    <label>Email</label>
                    <input name="email" type="email" required placeholder="jan@email.com"/>
                </div>
                <div class="field">
                    <label>Phone number</label>
                    <input name="phoneNumber" required minlength="3" placeholder="+48 000 000 000"/>
                </div>
            </div>

            <div class="field">
                <label>Date of birth</label>
                <input name="birthdate" type="date" required/>
            </div>

            <button class="btn-submit green" type="submit">Create Account</button>
        </form>

        <p class="auth-footer">
            Already have an account? <a href="/login">Log in</a>
        </p>
    </div>
</div>

</body>
</html>
