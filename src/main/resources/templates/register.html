<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Register – SportRadar</title>
    <link rel="stylesheet" th:href="@{/css/Style.css}">
</head>
<body class="auth-wrap">

<nav class="navbar green">
    <a class="navbar-brand" href="/">SportRadar</a>
</nav>

<div class="auth-body">
    <div class="auth-card" style="max-width:520px">
        <div class="auth-logo">Create account 🏃</div>
        <p class="auth-subtitle">Join SportRadar and start playing</p>

        <form th:action="@{/register}" th:object="${registerForm}" method="post" novalidate>

            <div class="form-row">
                <div class="field">
                    <label>Username *</label>
                    <input th:field="*{login}"
                           th:classappend="${#fields.hasErrors('login')} ? 'input-error'"
                           placeholder="cool_player"/>
                    <span class="field-error" th:if="${#fields.hasErrors('login')}"
                          th:errors="*{login}">Error</span>
                </div>
                <div class="field">
                    <label>Password *</label>
                    <input th:field="*{password}" type="password"
                           th:classappend="${#fields.hasErrors('password')} ? 'input-error'"
                           placeholder="••••••••"/>
                    <span class="field-error" th:if="${#fields.hasErrors('password')}"
                          th:errors="*{password}">Error</span>
                </div>
            </div>

            <div class="field">
                <label>Full name *</label>
                <input th:field="*{name}"
                       th:classappend="${#fields.hasErrors('name')} ? 'input-error'"
                       placeholder="Jan Kowalski"/>
                <span class="field-error" th:if="${#fields.hasErrors('name')}"
                      th:errors="*{name}">Error</span>
            </div>

            <div class="form-row">
                <div class="field">
                    <label>Email *</label>
                    <input th:field="*{email}" type="email"
                           th:classappend="${#fields.hasErrors('email')} ? 'input-error'"
                           placeholder="jan@email.com"/>
                    <span class="field-error" th:if="${#fields.hasErrors('email')}"
                          th:errors="*{email}">Error</span>
                </div>
                <div class="field">
                    <label>Phone</label>
                    <input th:field="*{phoneNumber}"
                           th:classappend="${#fields.hasErrors('phoneNumber')} ? 'input-error'"
                           placeholder="+48 600 123 456"/>
                    <span class="field-error" th:if="${#fields.hasErrors('phoneNumber')}"
                          th:errors="*{phoneNumber}">Error</span>
                </div>
            </div>

            <div class="field">
                <label>Date of birth *</label>
                <input th:field="*{birthdate}" type="date"
                       th:classappend="${#fields.hasErrors('birthdate')} ? 'input-error'"/>
                <span class="field-error" th:if="${#fields.hasErrors('birthdate')}"
                      th:errors="*{birthdate}">Error</span>
            </div>

            <button class="btn-submit green" type="submit">Create Account</button>
        </form>

        <p class="auth-footer">
            Already have an account? <a href="/login">Log in</a>
        </p>
    </div>
</div>

</body>
</html>
