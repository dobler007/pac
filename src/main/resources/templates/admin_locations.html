<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Admin – Locations – SportRadar</title>
    <link rel="stylesheet" th:href="@{/css/Style.css}">
</head>
<body>

<nav class="navbar maroon">
    <a class="navbar-brand" href="/">SportRadar</a>
    <div class="navbar-right">
        <th:block th:if="${currentUser != null}">
            <a th:href="@{/profile}" style="text-decoration:none">
                <div class="avatar-circle"><span th:text="${#strings.substring(currentUser.name,0,1)}">U</span></div>
            </a>
            <form th:action="@{/logout}" method="post" style="margin:0">
                <button class="btn-nav">Log out</button>
            </form>
        </th:block>
    </div>
</nav>

<div class="page-banner maroon">
    <h1>Admin – Locations</h1>
    <p>Manage all locations on the platform</p>
</div>

<div class="inner-page">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px">
        <span style="color:var(--muted);font-size:.9rem"
              th:text="${#lists.size(locations)} + ' location(s)'">0 locations</span>
        <a href="/admin/locations/new"
           class="btn-submit maroon"
           style="width:auto;padding:10px 22px;font-size:.88rem;text-decoration:none">+ Add Location</a>
    </div>

    <div class="s-card" style="padding:0;overflow:hidden">
        <table style="width:100%;border-collapse:collapse">
            <thead>
            <tr style="background:var(--bg)">
                <th style="padding:14px 18px;font-size:.75rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;text-align:left">#</th>
                <th style="padding:14px 18px;font-size:.75rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;text-align:left">Name</th>
                <th style="padding:14px 18px;font-size:.75rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;text-align:left">Address</th>
                <th style="padding:14px 18px;font-size:.75rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px"></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="l, iter : ${locations}"
                style="border-top:1px solid var(--border)">
                <td style="padding:14px 18px;color:var(--muted);font-size:.85rem" th:text="${iter.count}">1</td>
                <td style="padding:14px 18px;font-weight:600" th:text="${l.name}">Name</td>
                <td style="padding:14px 18px;color:var(--muted);font-size:.88rem" th:text="${l.address}">Address</td>
                <td style="padding:14px 18px;text-align:right">
                    <a th:href="@{/locations/{id}(id=${l.id})}"
                       style="color:var(--green);font-weight:600;font-size:.85rem;text-decoration:none">View →</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(locations)}">
                <td colspan="4" style="padding:32px;text-align:center;color:var(--muted)">No locations yet.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <a href="/" class="back-link" style="margin-top:24px">&#8592; Home</a>
</div>

</body>
</html>
