<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Post Game</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <style>
        #map { height: 400px; width: 100%; margin-bottom: 10px; }
    </style>
</head>
<body>

<h1>Post Game</h1>

<form th:action="@{/games}" method="post">

    <label>Title:
        <input name="title" required/>
    </label><br/>

    <label>Sport:
        <select name="sportId" required>
            <option th:each="s : ${sports}"
                    th:value="${s.id}"
                    th:text="${s.name}">
            </option>
        </select>
    </label><br/>

    <label>Game Date:
        <input type="date" name="startDate" required/>
    </label><br/>

    <label>Game Time:
        <input type="time" name="startTime" required/>
    </label><br/>

    <hr/>

    <label>Choose existing location (optional):
        <select name="locationId" id="locationId">
            <option value="">-- Custom (type address below) --</option>
            <option th:each="l : ${locations}"
                    th:value="${l.id}"
                    th:text="${l.name} + ' — ' + ${l.address}">
            </option>
        </select>
    </label><br/>

    <div id="customLocationBlock">
        <label>Location Name:
            <input name="locationName" id="locationName" placeholder="e.g., Central Park"/>
        </label><br/>

        <label>Address:
            <input type="text" name="address" id="address" placeholder="Enter address"/>
        </label><br/>

        <div id="map"></div>

        <input type="hidden" name="latitude" id="latitude"/>
        <input type="hidden" name="longitude" id="longitude"/>
    </div>

    <label>Description:
        <textarea name="description"></textarea>
    </label><br/>

    <label>Capacity:
        <input type="number" name="capacity" required/>
    </label><br/>

    <label>Price Per Person:
        <input type="number" name="pricePerPerson"/>
    </label><br/>

    <button type="submit">Create</button>
</form>

<button onclick="location.href='/games'">Back to Games</button>

<script>
    const locationSelect = document.getElementById('locationId');
    const customBlock = document.getElementById('customLocationBlock');

    const locationNameInput = document.getElementById('locationName');
    const addressInput = document.getElementById('address');
    const latInput = document.getElementById('latitude');
    const lngInput = document.getElementById('longitude');

    function setCustomRequired(on) {
        locationNameInput.required = on;
        addressInput.required = on;
        latInput.required = on;
        lngInput.required = on;
    }

    function toggleCustomBlock() {
        const usingExisting = locationSelect.value && locationSelect.value.trim() !== "";
        customBlock.style.display = usingExisting ? 'none' : 'block';
        setCustomRequired(!usingExisting);
    }

    toggleCustomBlock();
    locationSelect.addEventListener('change', toggleCustomBlock);

    const map = L.map('map').setView([52.2297, 21.0122], 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    let marker;

    map.on('click', function(e) {
        const { lat, lng } = e.latlng;
        if (marker) map.removeLayer(marker);
        marker = L.marker([lat, lng]).addTo(map);
        latInput.value = lat;
        lngInput.value = lng;
    });

    addressInput.addEventListener('change', async function() {
        const addr = this.value;
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(addr)}`);
        const data = await res.json();
        if (data.length > 0) {
            const { lat, lon } = data[0];
            map.setView([lat, lon], 15);
            if (marker) map.removeLayer(marker);
            marker = L.marker([lat, lon]).addTo(map);
            latInput.value = lat;
            lngInput.value = lon;
        }
    });
</script>

</body>
</html>
