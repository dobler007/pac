<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${player.name} + ' – SportRadar'">Profile</title>
    <link rel="stylesheet" th:href="@{/css/Style.css}">
</head>
<body>

<nav class="navbar green">
    <a class="navbar-brand" href="/">SportRadar</a>
    <div class="navbar-right">
        <th:block th:if="${currentUser != null}">
            <a th:href="@{/profile}" style="text-decoration:none">
                <div class="avatar-circle"><span th:text="${#strings.substring(currentUser.name,0,1)}">U</span></div>
            </a>
            <form th:action="@{/logout}" method="post" style="margin:0">
                <button class="btn-nav">Log out</button>
            </form>
        </th:block>
        <th:block th:if="${currentUser == null}">
            <button class="btn-nav" onclick="location.href='/login'">Log in</button>
        </th:block>
    </div>
</nav>

<div class="page-banner green">
    <h1 th:text="${player.name}">Player Name</h1>
    <p th:text="'@' + ${player.login}">@username</p>
</div>

<div class="inner-page">

    <!-- Stats -->
    <div class="stat-row">
        <div class="stat-box">
            <div class="stat-val" th:text="${age}">0</div>
            <div class="stat-lbl">Age</div>
        </div>
        <div class="stat-box">
            <div class="stat-val" th:text="${avgSkill} + ' ★'">0</div>
            <div class="stat-lbl">Skill</div>
        </div>
        <div class="stat-box">
            <div class="stat-val" th:text="${avgBehavior} + ' ★'">0</div>
            <div class="stat-lbl">Behavior</div>
        </div>
        <div class="stat-box">
            <div class="stat-val" th:text="${#sets.size(player.games)}">0</div>
            <div class="stat-lbl">Games</div>
        </div>
    </div>

    <div class="detail-cols">

        <!-- Left: info + rating -->
        <div>
            <div class="s-card">
                <h2>Contact</h2>
                <div class="player-row">
                    <span style="color:var(--muted);font-size:.82rem;width:80px">Email</span>
                    <span th:text="${player.email}">—</span>
                </div>
                <div class="player-row">
                    <span style="color:var(--muted);font-size:.82rem;width:80px">Phone</span>
                    <span th:text="${player.phoneNumber}">—</span>
                </div>
            </div>

            <div class="s-card" th:if="${currentUser != null and currentUser.id != player.id}">
                <h2 th:text="${alreadyRated} ? 'Update Rating' : 'Rate Player'">Rate</h2>
                <form th:action="@{/players/{id}/rate(id=${player.id})}" method="post">
                    <div class="form-row">
                        <div class="field">
                            <label>Skill (1–5)</label>
                            <select name="skill" required>
                                <option th:each="i : ${#numbers.sequence(1,5)}"
                                        th:value="${i}" th:text="${i}"
                                        th:selected="${existingSkill != null and existingSkill == i}"></option>
                            </select>
                        </div>
                        <div class="field">
                            <label>Behavior (1–5)</label>
                            <select name="behavior" required>
                                <option th:each="i : ${#numbers.sequence(1,5)}"
                                        th:value="${i}" th:text="${i}"
                                        th:selected="${existingBehavior != null and existingBehavior == i}"></option>
                            </select>
                        </div>
                    </div>
                    <button class="btn-submit green" type="submit"
                            th:text="${alreadyRated} ? 'Update Rating' : 'Submit Rating'"
                            style="margin-top:4px">Submit</button>
                </form>
            </div>

            <!-- Profile link -->
            <div class="s-card">
                <h2>Share Profile</h2>
                <input type="text" th:value="${profileLink}" readonly
                       style="width:100%;background:var(--bg);font-size:.85rem"/>
                <button class="btn-submit dark" style="margin-top:10px;width:auto;padding:10px 20px"
                        onclick="navigator.clipboard.writeText(window.location.href)">Copy Link</button>
            </div>
        </div>

        <!-- Right: games -->
        <div class="s-card">
            <h2>Games Joined (<span th:text="${#sets.size(player.games)}">0</span>)</h2>
            <div th:if="${#sets.isEmpty(player.games)}" class="empty" style="padding:20px 0">No games joined yet.</div>
            <div th:each="g : ${player.games}" class="player-row">
                <div style="flex:1">
                    <div style="font-weight:600" th:text="${g.title}">Game</div>
                    <div style="font-size:.8rem;color:var(--muted)" th:text="${g.sport.name} + ' · ' + ${g.startDate}">Sport</div>
                </div>
                <a th:href="@{/games/{id}(id=${g.id})}"
                   style="font-size:.82rem;color:var(--green);font-weight:600;text-decoration:none">View →</a>
            </div>
        </div>

    </div>

    <a href="/" class="back-link">&#8592; Home</a>
</div>

</body>
</html>
