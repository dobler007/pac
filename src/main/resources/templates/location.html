<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${location.name}">Location</title>
    <link th:href="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css}" rel="stylesheet"/>
</head>
<body class="container py-4">

<h1 th:text="${location.name}">Location</h1>
<p><strong>Address:</strong> <span th:text="${location.address}"></span></p>

<hr/>

<h3>Reviews</h3>

<div th:if="${currentUser != null}" class="card p-3 mb-4">
    <form th:action="@{/locations/{id}/review(id=${location.id})}" method="post">
        <div class="mb-2">
            <label class="form-label">Stars (1–5)</label>
            <select class="form-select" name="stars" required>
                <option th:each="i : ${#numbers.sequence(1,5)}"
                        th:value="${i}"
                        th:text="${i}"
                        th:selected="${myReview != null and myReview.stars == i}">
                </option>
            </select>
        </div>

        <div class="mb-2">
            <label class="form-label">Your review</label>
            <textarea class="form-control" name="description" rows="3" maxlength="1000"
                      th:text="${myReview != null ? myReview.description : ''}"></textarea>
        </div>

        <button class="btn btn-primary" type="submit"
                th:text="${myReview != null} ? 'Update review' : 'Submit review'">
            Submit review
        </button>
    </form>
</div>

<div th:if="${currentUser == null}" class="alert alert-secondary">
    Please <a th:href="@{/login}">log in</a> to leave a review.
</div>

<table class="table table-striped">
    <thead>
    <tr>
        <th>#</th>
        <th>User</th>
        <th>Stars</th>
        <th>Review</th>
        <th th:if="${isAdmin}">Admin</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="r,iter : ${reviews}">
        <td th:text="${iter.count}">1</td>
        <td>
            <a th:href="@{/players/{id}(id=${r.user.id})}" th:text="${r.user.name}">User</a>
        </td>
        <td th:text="${r.stars}">5</td>
        <td th:text="${r.description}">Text</td>
        <td th:if="${isAdmin}">
            <form th:action="@{/admin/reviews/{id}/delete(id=${r.id})}" method="post" style="display:inline">
                <button class="btn btn-sm btn-outline-danger" type="submit">Delete</button>
            </form>
        </td>
    </tr>
    <tr th:if="${#lists.isEmpty(reviews)}">
        <td th:colspan="${isAdmin ? 5 : 4}">No reviews yet.</td>
    </tr>
    </tbody>
</table>

<button class="btn btn-link" onclick="location.href='/locations'">← Back to Locations</button>

<script th:src="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
