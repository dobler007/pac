<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${location.name} + ' – SportRadar'">Location</title>
    <link rel="stylesheet" th:href="@{/css/Style.css}">
</head>
<body>

<nav class="navbar green">
    <a class="navbar-brand" href="/">SportRadar</a>
    <div class="navbar-right">
        <th:block th:if="${currentUser != null}">
            <a th:href="@{/profile}" style="text-decoration:none">
                <div class="avatar-circle"><span th:text="${#strings.substring(currentUser.name,0,1)}">U</span></div>
            </a>
            <form th:action="@{/logout}" method="post" style="margin:0">
                <button class="btn-nav">Log out</button>
            </form>
        </th:block>
        <th:block th:if="${currentUser == null}">
            <button class="btn-nav" onclick="location.href='/login'">Log in</button>
        </th:block>
    </div>
</nav>

<div class="page-banner green">
    <h1 th:text="${location.name}">Location</h1>
    <p th:text="${location.address}">Address</p>
</div>

<div class="inner-page">
    <div class="detail-cols">

        <!-- Left: review form + reviews -->
        <div>
            <div class="s-card" th:if="${currentUser != null}">
                <h2 th:text="${myReview != null} ? 'Update Your Review' : 'Leave a Review'">Review</h2>
                <form th:action="@{/locations/{id}/review(id=${location.id})}" method="post">
                    <div class="field">
                        <label>Stars (1–5)</label>
                        <select name="stars" required>
                            <option th:each="i : ${#numbers.sequence(1,5)}"
                                    th:value="${i}" th:text="${i} + ' ★'"
                                    th:selected="${myReview != null and myReview.stars == i}"></option>
                        </select>
                    </div>
                    <div class="field">
                        <label>Your review</label>
                        <textarea name="description" rows="3" maxlength="1000"
                                  th:text="${myReview != null ? myReview.description : ''}"></textarea>
                    </div>
                    <button class="btn-submit green" type="submit"
                            th:text="${myReview != null} ? 'Update Review' : 'Submit Review'">Submit</button>
                </form>
            </div>

            <div class="s-card" th:if="${currentUser == null}">
                <p style="color:var(--muted)">
                    <a href="/login" style="color:var(--green);font-weight:600">Log in</a> to leave a review.
                </p>
            </div>
        </div>

        <!-- Right: reviews list -->
        <div class="s-card">
            <h2>Reviews (<span th:text="${#lists.size(reviews)}">0</span>)</h2>
            <div th:if="${#lists.isEmpty(reviews)}" class="empty" style="padding:20px 0">No reviews yet.</div>
            <div th:each="r, iter : ${reviews}" class="player-row" style="flex-direction:column;align-items:flex-start;gap:4px">
                <div style="display:flex;justify-content:space-between;width:100%">
                    <a class="player-name" th:href="@{/players/{id}(id=${r.user.id})}" th:text="${r.user.name}">User</a>
                    <span style="font-size:.85rem;color:var(--muted)" th:text="${r.stars} + ' ★'">5 ★</span>
                </div>
                <p style="font-size:.85rem;color:var(--muted);margin:0" th:text="${r.description}">Review text</p>
                <form th:if="${isAdmin}"
                      th:action="@{/admin/reviews/{id}/delete(id=${r.id})}" method="post">
                    <button type="submit" style="background:var(--danger);color:#fff;padding:4px 12px;font-size:.78rem;border-radius:6px">Delete</button>
                </form>
            </div>
        </div>

    </div>

    <a href="/locations" class="back-link">&#8592; Back to Locations</a>
</div>

</body>
</html>
