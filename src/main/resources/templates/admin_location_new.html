<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Admin - Add Location</title>
    <link th:href="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css}" rel="stylesheet"/>
</head>
<body class="container py-4">

<h1>Admin - Add Location</h1>

<form action="/admin/locations" method="post" class="card p-3">
    <div class="mb-2">
        <label class="form-label">Name</label>
        <input class="form-control" name="name" required/>
    </div>

    <div class="mb-2">
        <label class="form-label">Address</label>
        <input class="form-control" name="address" required/>
    </div>

    <div class="row g-2 mb-2">
        <div class="col-md-6">
            <label class="form-label">Latitude</label>
            <input class="form-control" name="latitude" type="number" step="any" required/>
        </div>
        <div class="col-md-6">
            <label class="form-label">Longitude</label>
            <input class="form-control" name="longitude" type="number" step="any" required/>
        </div>
    </div>

    <button class="btn btn-primary" type="submit">Create</button>
</form>

<button class="btn btn-link mt-3" onclick="location.href='/admin/locations'">← Back</button>

<script th:src="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
