<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Add Location – SportRadar</title>
    <link rel="stylesheet" th:href="@{/css/Style.css}">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
</head>
<body>

<nav class="navbar maroon">
    <a class="navbar-brand" href="/">SportRadar</a>
    <div class="navbar-right">
        <th:block th:if="${currentUser != null}">
            <a th:href="@{/profile}" style="text-decoration:none">
                <div class="avatar-circle"><span th:text="${#strings.substring(currentUser.name,0,1)}">U</span></div>
            </a>
        </th:block>
    </div>
</nav>

<div class="page-banner maroon">
    <h1>Add Location</h1>
    <p>Pin the location on the map and fill in the details</p>
</div>

<div class="inner-page">
    <form th:action="@{/admin/locations}" method="post">
        <div class="form-page-cols">
            <!-- LEFT -->
            <div class="s-card">
                <h2>Location details</h2>
                <div class="field">
                    <label>Name *</label>
                    <input name="name" required placeholder="e.g., City Stadium"/>
                </div>
                <div class="field">
                    <label>Address *</label>
                    <input name="address" id="address" required placeholder="Type to geocode on map…"/>
                </div>
                <div class="form-row">
                    <div class="field">
                        <label>Latitude *</label>
                        <input name="latitude" id="latitude" type="number" step="any" required placeholder="52.2297"/>
                    </div>
                    <div class="field">
                        <label>Longitude *</label>
                        <input name="longitude" id="longitude" type="number" step="any" required placeholder="21.0122"/>
                    </div>
                </div>
                <div style="display:flex;gap:12px;align-items:center;margin-top:8px">
                    <button class="btn-submit maroon" type="submit" style="width:auto;padding:13px 32px">Create Location</button>
                    <a href="/admin/locations" class="back-link">Cancel</a>
                </div>
            </div>

            <!-- RIGHT: map -->
            <div style="position:sticky;top:20px">
                <div class="s-card" style="padding:0;overflow:hidden">
                    <div id="map" style="height:420px;border-radius:var(--radius)"></div>
                </div>
            </div>
        </div>
    </form>
</div>

<script>
    const addressEl = document.getElementById('address');
    const latEl     = document.getElementById('latitude');
    const lngEl     = document.getElementById('longitude');

    const map = L.map('map').setView([52.2297, 21.0122], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    let marker;
    map.on('click', function(e) {
        const {lat, lng} = e.latlng;
        if (marker) map.removeLayer(marker);
        marker = L.marker([lat, lng]).addTo(map);
        latEl.value = lat.toFixed(6);
        lngEl.value = lng.toFixed(6);
    });

    addressEl.addEventListener('change', async function() {
        const res  = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(this.value)}`);
        const data = await res.json();
        if (data.length > 0) {
            const {lat, lon} = data[0];
            map.setView([lat, lon], 15);
            if (marker) map.removeLayer(marker);
            marker = L.marker([lat, lon]).addTo(map);
            latEl.value = parseFloat(lat).toFixed(6);
            lngEl.value = parseFloat(lon).toFixed(6);
        }
    });
</script>
</body>
</html>
