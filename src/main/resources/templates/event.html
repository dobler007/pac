<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${event.name} + ' – SportRadar'">Event</title>
    <link rel="stylesheet" th:href="@{/css/Style.css}">
</head>
<body>

<nav class="navbar green">
    <a class="navbar-brand" href="/">SportRadar</a>
    <div class="navbar-right">
        <th:block th:if="${currentUser != null}">
            <a th:href="@{/profile}" style="text-decoration:none">
                <div class="avatar-circle"><span th:text="${#strings.substring(currentUser.name,0,1)}">U</span></div>
            </a>
            <form th:action="@{/logout}" method="post" style="margin:0">
                <button class="btn-nav">Log out</button>
            </form>
        </th:block>
        <th:block th:if="${currentUser == null}">
            <button class="btn-nav" onclick="location.href='/login'">Log in</button>
            <button class="btn-nav outlined" onclick="location.href='/register'">Register</button>
        </th:block>
    </div>
</nav>

<div class="page-banner green">
    <h1 th:text="${event.name}">Event</h1>
    <p>
        <span th:if="${event.sport != null}" th:text="${event.sport.name} + ' · '">Sport · </span>
        <span th:if="${event.location != null}" th:text="${event.location.name} + ' · '">Location · </span>
        <span th:if="${event.startDate != null}" th:text="${event.startDate}">Date</span>
    </p>
</div>

<div class="inner-page">

    <!-- Info tiles -->
    <div class="info-grid" style="margin-bottom:28px">
        <div class="info-tile" th:if="${event.description != null and !event.description.isBlank()}">
            <div class="label">Description</div>
            <div class="value" style="font-size:.88rem" th:text="${event.description}">—</div>
        </div>
        <div class="info-tile" th:if="${event.startTime != null}">
            <div class="label">Time</div>
            <div class="value" th:text="${#temporals.format(event.startTime,'HH:mm')}">—</div>
        </div>
        <div class="info-tile" th:if="${event.capacity > 0}">
            <div class="label">Capacity</div>
            <div class="value" th:text="${event.capacity}">—</div>
        </div>
        <div class="info-tile" th:if="${event.pricePerPerson != null}">
            <div class="label">Price</div>
            <div class="value" th:text="${event.pricePerPerson > 0 ? event.pricePerPerson + ' PLN' : 'Free'}">—</div>
        </div>
    </div>

    <!-- Top Scorers -->
    <div class="s-card" th:if="${!#lists.isEmpty(topScorers)}" style="margin-bottom:28px">
        <h2>🏆 Top Scorers</h2>
        <table class="score-table">
            <thead>
            <tr>
                <th style="width:40px">#</th>
                <th>Player</th>
                <th style="text-align:center">Goals</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="ts, stat : ${topScorers}">
                <td style="color:var(--muted);font-size:.85rem" th:text="${stat.count}">1</td>
                <td>
                    <a class="player-name" th:href="@{/players/{id}(id=${ts.player.id})}"
                       th:text="${ts.player.name}">Player</a>
                </td>
                <td class="score-num" th:text="${ts.goals}">0</td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- Games -->
    <h2 style="font-size:1.2rem;font-weight:700;margin-bottom:16px">Games</h2>

    <div class="empty" th:if="${#lists.isEmpty(boards)}">No games in this event yet.</div>

    <div class="s-card" th:each="board : ${boards}" style="margin-bottom:20px">

        <!-- Game header -->
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px">
            <div>
                <a th:href="@{/games/{id}(id=${board.game.id})}"
                   th:text="${board.game.title}"
                   style="font-size:1.05rem;font-weight:700;color:var(--text)">Game</a>
                <span th:if="${board.game.sport != null}"
                      style="color:var(--muted);font-size:.85rem;margin-left:6px"
                      th:text="'— ' + ${board.game.sport.name}"></span>
            </div>
            <div style="display:flex;align-items:center;gap:10px">
                <!-- State badge -->
                <span th:switch="${board.game.state?.name()}">
                    <span th:case="'UPCOMING'"  class="state-pill upcoming">Upcoming</span>
                    <span th:case="'ONGOING'"   class="state-pill ongoing">Ongoing</span>
                    <span th:case="'FINISHED'"  class="state-pill finished">Finished</span>
                    <span th:case="'CANCELLED'" class="state-pill cancelled">Cancelled</span>
                </span>
                <!-- Owner: change state -->
                <form th:if="${isOwner}"
                      th:action="@{/events/{eid}/games/{gid}/state(eid=${event.id},gid=${board.game.id})}"
                      method="post" style="display:flex;gap:6px;align-items:center">
                    <select name="state" style="padding:5px 8px;font-size:.82rem;border-radius:8px">
                        <option th:each="s : ${states}"
                                th:value="${s.name()}"
                                th:text="${s.name()}"
                                th:selected="${s == board.game.state}">STATE</option>
                    </select>
                    <button type="submit" class="btn-submit dark"
                            style="width:auto;padding:5px 14px;font-size:.82rem;border-radius:8px;margin:0">Set</button>
                </form>
            </div>
        </div>

        <!-- Scoreboard table -->
        <table class="score-table">
            <thead>
            <tr>
                <th>Player</th>
                <th style="text-align:center">Goals</th>
                <th th:if="${isOwner}" style="text-align:center">Adjust</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#sets.isEmpty(board.game.players)}">
                <td colspan="3" style="color:var(--muted);text-align:center;padding:16px">No players in this game.</td>
            </tr>
            <tr th:each="p : ${board.game.players}">
                <td>
                    <a class="player-name" th:href="@{/players/{id}(id=${p.id})}" th:text="${p.name}">Player</a>
                </td>
                <td class="score-num" th:text="${board.goalsFor(p.id)}">0</td>
                <td th:if="${isOwner}" style="text-align:center">
                    <div class="score-btns" style="justify-content:center">
                        <form th:action="@{/events/{eid}/games/{gid}/goals/add(eid=${event.id},gid=${board.game.id})}"
                              method="post" style="margin:0">
                            <input type="hidden" name="playerId" th:value="${p.id}"/>
                            <button type="submit" class="btn-score add">+</button>
                        </form>
                        <form th:action="@{/events/{eid}/games/{gid}/goals/remove-last(eid=${event.id},gid=${board.game.id})}"
                              method="post" style="margin:0">
                            <input type="hidden" name="playerId" th:value="${p.id}"/>
                            <button type="submit" class="btn-score rem"
                                    th:disabled="${board.goalsFor(p.id) == 0}">−</button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>

        <div th:if="${board.game.startDate != null}"
             style="margin-top:12px;font-size:.8rem;color:var(--muted)">
            📅 <span th:text="${board.game.startDate}"></span>
            <span th:if="${board.game.startTime != null}">
                ⏰ <span th:text="${#temporals.format(board.game.startTime,'HH:mm')}"></span>
            </span>
            <span th:if="${board.game.location != null}">
                📍 <span th:text="${board.game.location.name}"></span>
            </span>
        </div>
    </div>

    <a href="/events" class="back-link">&#8592; Back to Events</a>
</div>

</body>
</html>
